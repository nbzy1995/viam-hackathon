<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viam — local chat</title>
<style>
  :root{color-scheme:dark;--bg:#191919;--panel:#303030;--edge:#454545;--text:#ececec;--muted:#929292;--accent:#fff;--good:#69c98c;--bad:#ed8c8c}
  *{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .shell{width:min(980px,100%);height:100dvh;margin:0 auto;padding:22px 22px 18px;display:flex;flex-direction:column}
  header{height:50px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .brand{font-size:15px;font-weight:600;letter-spacing:.01em}.brand b{font-weight:400;color:#bcbcbc}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .status:before{content:"";width:7px;height:7px;background:#777;border-radius:50%}.status.live:before{background:var(--good);box-shadow:0 0 8px #69c98c66}.status.warn{color:var(--bad)}.status.warn:before{background:var(--bad)}
  #messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:28px 6px 30px;scroll-behavior:smooth}
  .empty{margin:auto;color:#858585;text-align:center;font-size:15px}
  .message{max-width:min(78%,680px);display:flex;flex-direction:column;gap:5px;animation:rise .16s ease-out}
  .message.you{align-self:flex-end;align-items:flex-end}.message.assistant{align-self:flex-start;align-items:flex-start}
  .who{font-size:11px;color:var(--muted);padding:0 4px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:#252525;border:1px solid #383838;border-radius:18px;padding:12px 16px;font-size:15px;line-height:1.55}
  .you .bubble{background:#343434;border-color:#484848}.system{align-self:center;max-width:90%;color:#b3b3b3;font-size:12px;text-align:center;padding:8px 12px;border:1px solid #3d3d3d;background:#232323;border-radius:12px}
  .composer-wrap{flex:none;padding-top:8px}.composer{background:var(--panel);border:1px solid var(--edge);border-radius:28px;padding:16px 14px 12px;box-shadow:0 6px 24px #0003;transition:border-color .15s,box-shadow .15s}
  .composer:focus-within{border-color:#5a5a5a;box-shadow:0 8px 30px #0005}
  textarea{display:block;width:100%;min-height:44px;max-height:180px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:8px 8px 14px}
  textarea::placeholder{color:#858585;opacity:1}.toolbar{display:flex;align-items:center;gap:10px;min-height:48px}
  .icon{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;color:#d5d5d5;background:transparent;cursor:pointer;flex:none}
  .icon:hover{background:#414141}.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .voice-state{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.voice-label{color:#a4a4a4;font-size:12px;white-space:nowrap}
  .waveform{height:34px;display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:25px;overflow:hidden}
  .waveform i{display:block;width:4px;min-width:2px;height:4px;border-radius:8px;background:#a5a5a5;animation:wave .72s ease-in-out infinite alternate;opacity:.9}
  .waveform i:nth-child(4n+1){--h:8px;animation-delay:-.1s}.waveform i:nth-child(4n+2){--h:17px;animation-delay:-.4s}.waveform i:nth-child(4n+3){--h:25px;animation-delay:-.25s}.waveform i:nth-child(4n){--h:12px;animation-delay:-.55s}
  .send,.stop{width:48px;height:48px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
  .send{background:#f6f6f6;color:#111}.send:hover{background:#fff}.send:disabled{opacity:.38;cursor:default}
  .send svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .stop{width:40px;height:40px;background:#262626;color:#ddd}.stop:hover{background:#484848}.stop svg{width:17px;height:17px;fill:currentColor}
  .quick-checks{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}.action,.quick-checks button{min-height:40px;border:1px solid #555;border-radius:10px;background:#292929;color:#eee;padding:8px 13px;cursor:pointer;font:inherit;font-size:12px}.action:disabled,.quick-checks button:disabled{opacity:.4;cursor:default}.danger{border-color:#985e5e;color:#ffbaba}.quick-checks button:hover,.action:hover{background:#3b3b3b}
  .hint{min-height:18px;padding:9px 8px 0;color:#858585;font-size:11px}.hint.error{color:var(--bad)}
  button:focus-visible,textarea:focus-visible{outline:2px solid #aaa;outline-offset:2px}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes wave{from{height:4px}to{height:var(--h,20px)}}
  @media(max-width:600px){.shell{padding:12px 12px 10px}.message{max-width:90%}.composer{border-radius:23px;padding:12px 10px 9px}textarea{font-size:16px}.voice-label{display:none}.waveform{gap:3px}.waveform i{width:3px}.icon{width:38px;height:38px}.send{width:44px;height:44px}}
</style></head><body><main class="shell">
<header><div class="brand">Viam <b>local chat</b></div><div class="status" id="status">Ready</div></header>
<nav id="quick-checks" class="quick-checks" aria-label="Robot quick checks"></nav>
<section id="messages" role="log" aria-live="polite"><div class="empty">Type a robot request or start live voice.</div></section>
<div class="composer-wrap"><div class="composer">
  <textarea id="prompt" rows="1" placeholder="Message" aria-label="Message"></textarea>
  <div class="toolbar">
    <button class="icon" id="mic" aria-label="Start live voice" title="Start live voice" disabled>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"></path></svg>
    </button>
    <div class="voice-state" id="voice-state" hidden>
      <button class="icon" id="cancel-voice" aria-label="Disconnect microphone" title="Disconnect microphone"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
      <span class="voice-label" id="voice-label">Listening</span>
      <div class="waveform" id="waveform" aria-hidden="true"></div>
      <button class="stop" id="end-chat" aria-label="Stop robot" title="Stop robot"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
    </div>
    <button class="stop" id="end-text-chat" aria-label="End chat" title="End chat" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
    <button id="read-reply" class="action" title="Read reply aloud" hidden>Read reply</button><button id="robot-stop" class="action danger" title="Stop robot">Stop robot</button><div style="flex:1"></div>
    <button class="send" id="send" aria-label="Send message" title="Send message" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"></path></svg></button>
  </div>
</div><div class="hint" id="hint">Loading local voice chat…</div></div>
</main>
<script type="module" src="/static/chat.bundle.js"></script></body></html>
