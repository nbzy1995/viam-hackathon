[project]
name = "viam-hackathon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "numpy>=2,<3",
 "pillow>=11,<13",
 "viam-sdk==0.84.0",
]

[project.optional-dependencies]
voice-ui = [
 "fastapi>=0.115,<1",
 "httpx>=0.27,<1",
 "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
